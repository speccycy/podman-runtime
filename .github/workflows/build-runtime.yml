name: Build Podman runtime (Debian 13 + Ubuntu 24.04 + Ubuntu 26.04)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:13
          - platform: ubuntu24.04
            image: ubuntu:24.04
          - platform: ubuntu26.04
            image: ubuntu:26.04
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential make pkg-config \
            libassuan-dev libbtrfs-dev libgpgme-dev libseccomp-dev \
            libsystemd-dev libdevmapper-dev libapparmor-dev libsqlite3-dev \
            libsubid-dev protobuf-compiler dpkg-dev file xz-utils zstd \
            autoconf automake libtool libcap-dev libjson-c-dev libprotobuf-c-dev python3

      - name: Checkout pinned sources
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Validate scripts and show installer help
        shell: bash
        run: |
          set -euo pipefail
          for script in scripts/*.sh; do bash -n "$script"; done
          bash scripts/install.sh --help >/dev/null

      - name: Build exact upstream runtime
        shell: bash
        run: scripts/build.sh

      - name: Package for native distribution
        shell: bash
        run: scripts/package.sh

      - name: Verify package contents and checksums
        shell: bash
        run: scripts/verify.sh

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: podman-runtime-${{ matrix.platform }}-${{ github.run_id }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS.*
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: debian13
            image: debian:13
            subid: libsubid5
          - platform: ubuntu24.04
            image: ubuntu:24.04
            subid: libsubid4
          - platform: ubuntu26.04
            image: ubuntu:26.04
            subid: libsubid5
    container:
      image: ${{ matrix.image }}

    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - name: Download matching platform package
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ matrix.platform }}-${{ github.run_id }}
          path: dist

      - name: Install on clean native distribution
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "SHA256SUMS.${{ matrix.platform }}"
          apt-get install -y ./podman-runtime_*_${{ matrix.platform }}_amd64.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-3"
          dpkg-query -W ${{ matrix.subid }}
          if [ "${{ matrix.platform }}" = ubuntu26.04 ]; then
            dpkg-query -W libgpgme45
            grep -Fx 'firewall_driver = "nftables"' /usr/share/containers/containers.conf.d/98-infh-netavark-nftables.conf
          else
            dpkg-query -W libgpgme11t64
          fi
          podman --version | grep -F "podman version 6.1.4"
          /usr/libexec/podman/netavark --version | grep -F "2.1.0"
          /usr/libexec/podman/aardvark-dns --version | grep -F "2.1.0"
          /usr/libexec/podman/crun --version | grep -F "1.30.1"
          ! ldd /usr/bin/podman | grep -F "not found"
          ! ldd /usr/libexec/podman/crun | grep -F "not found"
          for binary in /usr/libexec/podman/netavark /usr/libexec/podman/aardvark-dns; do
            ! ldd "$binary" 2>&1 | grep -F "not found"
          done
          test -f /usr/share/containers/containers.conf.d/99-infh-pinned-crun.conf
          test -f /usr/share/containers/containers.conf
          test -f /usr/share/containers/seccomp.json
          test -f /usr/share/containers/policy.json
          test -f /usr/share/containers/registries.conf
          test -f /usr/share/containers/registries.d/default.yaml
          for package in netavark aardvark-dns golang-github-containers-common golang-github-containers-image; do
            status="$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)"
            test "$status" != "install ok installed"
          done

  ubuntu-host-smoke:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download Ubuntu package
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-ubuntu24.04-${{ github.run_id }}
          path: dist

      - name: Install runtime on real Ubuntu runner host
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.ubuntu24.04)
          sudo apt-get update
          sudo apt-get install -y ./dist/podman-runtime_*_ubuntu24.04_amd64.deb
          podman --version | grep -F "podman version 6.1.4"
          sudo podman info --format '{{.Host.CgroupsVersion}} {{.Host.NetworkBackend}}' | grep -F 'v2 netavark'
          /usr/libexec/podman/crun --version | grep -F "1.30.1"
          sudo podman info --format '{{.Host.OCIRuntime.Path}}' | grep -Fx '/usr/libexec/podman/crun'
          sudo podman run --rm docker.io/library/alpine:3.21 sh -c 'echo PODMAN_CONTAINER_OK' | grep -F PODMAN_CONTAINER_OK

  ubuntu26-host-smoke:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - name: Download native Ubuntu 26.04 package
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-ubuntu26.04-${{ github.run_id }}
          path: dist

      - name: Install and accept real rootful runtime
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.ubuntu26.04)
          sudo apt-get update
          sudo apt-get install -y ./dist/podman-runtime_*_ubuntu26.04_amd64.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-3"
          podman --version | grep -F "podman version 6.1.4"
          /usr/libexec/podman/netavark --version | grep -F '2.1.0'
          /usr/libexec/podman/aardvark-dns --version | grep -F '2.1.0'
          /usr/libexec/podman/crun --version | grep -F '1.30.1'
          ! ldd /usr/bin/podman | grep -F 'not found'
          ! ldd /usr/libexec/podman/crun | grep -F 'not found'
          for binary in /usr/libexec/podman/netavark /usr/libexec/podman/aardvark-dns; do
            ! ldd "$binary" 2>&1 | grep -F 'not found'
          done
          sudo podman info --format '{{.Host.CgroupsVersion}} {{.Host.NetworkBackend}}' | grep -Fx 'v2 netavark'
          sudo podman info --format '{{.Host.OCIRuntime.Path}}' | grep -Fx '/usr/libexec/podman/crun'
          grep -Fx 'firewall_driver = "nftables"' /usr/share/containers/containers.conf.d/98-infh-netavark-nftables.conf
          # Show conflicting host configuration if the runner retained distro settings.
          sudo grep -R -h -E '^[[:space:]]*firewall_driver[[:space:]]*=' /etc/containers /usr/share/containers/containers.conf.d 2>/dev/null || true
          sudo podman run --rm docker.io/library/alpine:3.21 sh -c 'echo PODMAN_CONTAINER_OK' | grep -F PODMAN_CONTAINER_OK

  upgrade-debian-smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: v6.1.2-1
            asset: podman-runtime_6.1.2_amd64.deb
            sha: bc5dacab001ef19d5a390cedb01f87e720d02a64436f211ca59e561e0cff49cd
          - tag: v6.1.4-1
            asset: podman-runtime_6.1.4-1_amd64.deb
            sha: 7528d4da6e4dec1e70d1d4676279d376e622271fb52f4727bffc0f556ce2592e
    container:
      image: debian:13
    steps:
      - name: Install test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl

      - name: Install previous released package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            "https://github.com/speccycy/podman-runtime/releases/download/${{ matrix.tag }}/${{ matrix.asset }}" \
            -o /tmp/previous.deb
          echo "${{ matrix.sha }}  /tmp/previous.deb" | sha256sum -c -
          apt-get install -y /tmp/previous.deb

      - name: Download Debian package
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-debian13-${{ github.run_id }}
          path: dist

      - name: Verify upgrade path
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./dist/podman-runtime_*_debian13_amd64.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-3"
          podman --version | grep -F "podman version 6.1.4"

  ubuntu-upgrade-smoke:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:24.04
    steps:
      - name: Install Ubuntu distro Podman first
        run: |
          apt-get update
          apt-get install -y --no-install-recommends podman
          podman --version

      - name: Download Ubuntu package
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-ubuntu24.04-${{ github.run_id }}
          path: dist

      - name: Upgrade to pinned runtime
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./dist/podman-runtime_*_ubuntu24.04_amd64.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-3"
          podman --version | grep -F "podman version 6.1.4"

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, package-smoke, ubuntu-host-smoke, ubuntu26-host-smoke, upgrade-debian-smoke, ubuntu-upgrade-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout pinned versions
        uses: actions/checkout@v4

      - name: Download all platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: podman-runtime-*-${{ github.run_id }}
          merge-multiple: true
          path: dist

      - name: Verify release payload and create checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 3
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 3
          cat SHA256SUMS.debian13 SHA256SUMS.ubuntu24.04 SHA256SUMS.ubuntu26.04 > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source versions.env
          tag="v$PODMAN_VERSION-$PACKAGE_REVISION"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $tag already exists"; exit 0
            fi
            release_source=(--target "$GITHUB_SHA")
          else
            test "$GITHUB_REF_NAME" = "$tag"
            release_source=(--verify-tag)
          fi
          cat > release-notes.md <<EOF
          Native runtime packages for Debian 13, Ubuntu 24.04 and Ubuntu 26.04 (amd64).
          Podman $PODMAN_VERSION pinned to $PODMAN_SHA
          Netavark $NETAVARK_VERSION pinned to $NETAVARK_SHA
          Aardvark DNS $AARDVARK_VERSION pinned to $AARDVARK_SHA

          Select the OS-specific .deb package, verify SHA256SUMS, or use scripts/install.sh.
          EOF
          gh release create "$tag" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" "${release_source[@]}" \
            --title "Podman runtime $tag" --notes-file release-notes.md
