name: Build Debian 13 runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential make pkg-config \
            libassuan-dev libbtrfs-dev libgpgme-dev libseccomp-dev \
            libsystemd-dev libdevmapper-dev libapparmor-dev libsqlite3-dev \
            libsubid-dev protobuf-compiler dpkg-dev file xz-utils zstd

      - name: Checkout runtime repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build exact upstream runtime
        shell: bash
        run: scripts/build.sh

      - name: Package runtime
        shell: bash
        run: scripts/package.sh

      - name: Verify artifacts
        shell: bash
        run: scripts/verify.sh

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: podman-runtime-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install smoke-test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ github.ref_name }}-${{ github.run_number }}
          path: dist

      - name: Install package on clean Debian 13
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          podman --version | grep -F "podman version 6.1.2"
          /usr/libexec/podman/netavark --version | grep -F "2.1.0"
          /usr/libexec/podman/aardvark-dns --version | grep -F "2.1.0"
          ldd /usr/bin/podman | tee /tmp/podman-ldd.txt
          ! grep -F "not found" /tmp/podman-ldd.txt
          test -f /usr/share/containers/containers.conf
          test -f /usr/share/containers/seccomp.json
          test -f /usr/share/containers/policy.json
          test -f /usr/share/containers/registries.conf
          test -f /usr/share/containers/registries.d/default.yaml
          ! dpkg-query -W netavark >/dev/null 2>&1
          ! dpkg-query -W aardvark-dns >/dev/null 2>&1
          ! dpkg-query -W golang-github-containers-common >/dev/null 2>&1
          ! dpkg-query -W golang-github-containers-image >/dev/null 2>&1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, package-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ github.ref_name }}-${{ github.run_number }}
          path: dist

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source versions.env
          cat > release-notes.md <<EOF
          Debian 13 amd64 runtime bundle built from exact upstream commits.

          - Podman ${PODMAN_VERSION}: ${PODMAN_SHA}
          - Netavark ${NETAVARK_VERSION}: ${NETAVARK_SHA}
          - Aardvark DNS ${AARDVARK_VERSION}: ${AARDVARK_SHA}

          Verify downloaded assets with SHA256SUMS before installation.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Podman runtime $GITHUB_REF_NAME" \
            --notes-file release-notes.md
