name: Build Debian 13 runtime

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential make pkg-config \
            libassuan-dev libbtrfs-dev libgpgme-dev libseccomp-dev \
            libsystemd-dev libdevmapper-dev libapparmor-dev libsqlite3-dev \
            libsubid-dev protobuf-compiler dpkg-dev file xz-utils zstd

      - name: Checkout runtime repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build exact upstream runtime
        shell: bash
        run: scripts/build.sh

      - name: Package runtime
        shell: bash
        run: scripts/package.sh

      - name: Verify artifacts
        shell: bash
        run: scripts/verify.sh

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: podman-runtime-${{ github.run_id }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

  package-smoke:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install smoke-test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ github.run_id }}
          path: dist

      - name: Install package on clean Debian 13
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-1"
          podman --version | grep -F "podman version 6.1.4"
          /usr/libexec/podman/netavark --version | grep -F "2.1.0"
          /usr/libexec/podman/aardvark-dns --version | grep -F "2.1.0"
          ldd /usr/bin/podman | tee /tmp/podman-ldd.txt
          ! grep -F "not found" /tmp/podman-ldd.txt
          test -f /usr/share/containers/containers.conf
          test -f /usr/share/containers/seccomp.json
          test -f /usr/share/containers/policy.json
          test -f /usr/share/containers/registries.conf
          test -f /usr/share/containers/registries.d/default.yaml
          package_not_installed() {
            status="$(dpkg-query -W -f='${Status}' "$1" 2>/dev/null || true)"
            [ "$status" != "install ok installed" ]
          }
          package_not_installed netavark
          package_not_installed aardvark-dns
          package_not_installed golang-github-containers-common
          package_not_installed golang-github-containers-image

  upgrade-smoke:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install upgrade-test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl

      - name: Install first runtime release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/speccycy/podman-runtime/releases/download/v6.1.2-1/podman-runtime_6.1.2_amd64.deb \
            --output /tmp/podman-runtime-v1.deb
          echo "bc5dacab001ef19d5a390cedb01f87e720d02a64436f211ca59e561e0cff49cd  /tmp/podman-runtime-v1.deb" | sha256sum -c -
          apt-get install -y /tmp/podman-runtime-v1.deb
          dpkg-query -W golang-github-containers-common
          dpkg-query -W golang-github-containers-image
          dpkg-query -W netavark
          dpkg-query -W aardvark-dns

      - name: Download current runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ github.run_id }}
          path: dist

      - name: Upgrade first release to current package
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-1"
          podman --version | grep -F "podman version 6.1.4"
          /usr/libexec/podman/netavark --version | grep -F "2.1.0"
          /usr/libexec/podman/aardvark-dns --version | grep -F "2.1.0"
          package_not_installed() {
            status="$(dpkg-query -W -f='${Status}' "$1" 2>/dev/null || true)"
            [ "$status" != "install ok installed" ]
          }
          package_not_installed golang-github-containers-common
          package_not_installed golang-github-containers-image
          package_not_installed netavark
          package_not_installed aardvark-dns

  upgrade-latest-smoke:
    needs: build
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install upgrade-test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl

      - name: Install last verified runtime release
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://github.com/speccycy/podman-runtime/releases/download/v6.1.3-1/podman-runtime_6.1.3-1_amd64.deb \
            --output /tmp/podman-runtime-v1.deb
          echo "b0b014931caced409fd1598fe65403e2b1fa27702191e96882ee0b9c5e1623c2  /tmp/podman-runtime-v1.deb" | sha256sum -c -
          apt-get install -y /tmp/podman-runtime-v1.deb

      - name: Download current runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ github.run_id }}
          path: dist

      - name: Upgrade last verified release to current package
        shell: bash
        run: |
          set -euo pipefail
          apt-get install -y ./dist/*.deb
          test "$(dpkg-query -W -f='${Version}' podman-runtime)" = "6.1.4-1"
          podman --version | grep -F "podman version 6.1.4"
          /usr/libexec/podman/netavark --version | grep -F "2.1.0"
          /usr/libexec/podman/aardvark-dns --version | grep -F "2.1.0"
          package_not_installed() {
            status="$(dpkg-query -W -f='${Status}' "$1" 2>/dev/null || true)"
            [ "$status" != "install ok installed" ]
          }
          package_not_installed golang-github-containers-common
          package_not_installed golang-github-containers-image
          package_not_installed netavark
          package_not_installed aardvark-dns

  release:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, package-smoke, upgrade-smoke, upgrade-latest-smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v4

      - name: Download runtime bundle
        uses: actions/download-artifact@v4
        with:
          name: podman-runtime-${{ github.run_id }}
          path: dist

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          test "$(find . -maxdepth 1 -name '*.deb' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source versions.env
          tag="v$PODMAN_VERSION-$PACKAGE_REVISION"
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release already exists"; exit 0
            fi
            release_source=(--target "$GITHUB_SHA")
          else
            test "$GITHUB_REF_NAME" = "$tag"
            release_source=(--verify-tag)
          fi
          cat > release-notes.md <<EOF
          Debian 13 amd64 runtime bundle built from exact upstream commits.
          - Podman $PODMAN_VERSION: $PODMAN_SHA
          - Netavark $NETAVARK_VERSION: $NETAVARK_SHA
          - Aardvark DNS $AARDVARK_VERSION: $AARDVARK_SHA
          Podman 6.1.4 includes Buildah 1.45.2 and Storage 1.64.2.
          Upstream gvproxy 0.9.0 addresses CVE-2026-107935 (gvproxy is not bundled).
          Verify downloaded assets with SHA256SUMS.
          EOF
          gh release create "$tag" dist/*.deb dist/*.tar.gz dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" "${release_source[@]}" \
            --title "Podman runtime $tag" --notes-file release-notes.md
