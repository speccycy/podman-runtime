name: Build Debian 13 runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: debian:13

    steps:
      - name: Install bootstrap tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential make pkg-config \
            libassuan-dev libbtrfs-dev libgpgme-dev libseccomp-dev \
            libsystemd-dev libdevmapper-dev libapparmor-dev libsqlite3-dev \
            libsubid-dev protobuf-compiler dpkg-dev file xz-utils zstd

      - name: Checkout runtime repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"
          cache: false

      - name: Set up Rust
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --profile minimal --default-toolchain 1.88.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build exact upstream runtime
        shell: bash
        run: scripts/build.sh

      - name: Package runtime
        shell: bash
        run: scripts/package.sh

      - name: Verify artifacts
        shell: bash
        run: scripts/verify.sh

      - name: Upload runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: podman-runtime-${{ github.ref_name }}-${{ github.run_number }}
          path: |
            dist/*.deb
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
